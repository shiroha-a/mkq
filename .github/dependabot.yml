version: 2

# アラートが出てから手で追うのをやめるための設定。
# PR は既定ブランチ (develop) 宛に来る。
#
# minor / patch はまとめて 1 本の PR にする。個別に来ると数が増えるだけで、
# 見る側が本当に読みたい major を埋もれさせる。major はグループから外して
# あるので、破壊的変更は単独の PR として届く。
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  # Interop harness. Test-only and shipped in no binary, but it runs in
  # CI and the bull-board smoke test depends on express.
  #
  # **bullmq のピンは third_party/bullmq submodule と対になっている。**
  # package.json にもそう書いてある。bullmq を上げる PR が来たら、submodule も
  # 同じタグに動かさないと「vendored Lua と照合している相手」がずれる。
  #
  # **ioredis は明示的に入れてある。消さないこと。** BullMQ 6 で必須依存から
  # optional peer dependency に変わり、npm は自動では入れなくなった。外すと
  # `new Queue(...)` が「could not load the optional 'ioredis' package」で
  # 落ちる。bullmq が依存しているから要らない、という判断は 5 系の話。
  - package-ecosystem: npm
    directory: /tests/interop/node
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    groups:
      interop-minor-and-patch:
        update-types:
          - minor
          - patch

  # Benchmark harness, likewise test-only.
  - package-ecosystem: npm
    directory: /bench/node
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    groups:
      bench-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - "*"
